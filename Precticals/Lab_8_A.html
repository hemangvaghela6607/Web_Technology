<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bootstrap Scrollspy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body data-bs-spy="scroll" data-bs-target="#navbar" data-bs-offset="70">

    <!-- Navbar -->
    <nav id="navbar" class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container">

            <a class="navbar-brand" href="#">My Website</a>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#services">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#contact">Contact</a>
                </li>
            </ul>

        </div>
    </nav>


    <!-- Sections -->

    <section id="home" class="bg-primary text-white text-center " style="height:500px; padding-top:120px !important;">
        <h1>Home</h1>
        <p>Welcome to my website</p>
    </section>

    <section id="about" class="bg-light text-center p-5" style="height:500px;">
        <h1>About</h1>
        <p>About our company</p>
    </section>

    <section id="services" class="bg-success text-white text-center p-5" style="height:500px;">
        <h1>Services</h1>
        <p>Our services</p>
    </section>

    <section id="contact" class="bg-warning text-center p-5" style="height:500px;">
        <h1>Contact</h1>
        <p>Contact us</p>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
