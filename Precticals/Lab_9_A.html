<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Card with Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f1fb !important;
    }
    .product-card {
      background: #ffffff;
      border: 1px solid #e5def5;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(80, 55, 150, 0.10);
      transition: 0.3s ease;
    }
    .product-image {
      height: 190px;
      margin: 12px;
      border-radius: 17px;
      overflow: hidden;
      background-color: #eee9fa;
    }
    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.4s ease;
    }
    .product-card:hover .product-image img {
      transform: scale(1.06);
    }
    .product-content {
      padding: 8px 18px 20px;
    }
    .product-title {
      color: #332b4d;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .product-price {
      color: #6c4bd6;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 15px;
    }
    .product-card .btn-primary {
      background-color: #6c4bd6;
      border-color: #6c4bd6;
      border-radius: 11px;
      padding: 10px;
      font-weight: 600;
      transition: 0.3s;
    }
    .product-card .btn-primary:hover {
      background-color: #5435b5;
      border-color: #5435b5;
    }
    h1.text-white {
      color: #51389b !important;
    }
    .card.m-5 {
      background-color: #ffffff;
      border: 1px solid #e4ddf5;
      border-radius: 15px;
      overflow: hidden;
    }
    .card-header.bg-secondary {
      background-color: #6c4bd6 !important;
      border: none;
    }
    .card-header h2 {
      color: #ffffff !important;
    }
    .list-group-item {
      background-color: #faf9fd;
      border-color: #e5def3;
      color: #332b4d;
    }
    .list-group-item.fw-bold {
      background-color: #eee9fb;
      color: #5435b5;
    }
    .form-label {
      color: #4a4161;
      font-weight: 600;
    }
    .form-control {
      border: 1px solid #d9d0ed;
      border-radius: 8px;
      background-color: #ffffff;
    }
    .form-control:focus {
      border-color: #6c4bd6;
      box-shadow: 0 0 0 0.2rem rgba(108, 75, 214, 0.15);
    }
    .btn-success {
      background-color: #6c4bd6;
      border-color: #6c4bd6;
    }
    .btn-success:hover {
      background-color: #5435b5;
      border-color: #5435b5;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-white h3 mb-4">
      Products Showcase
    </h1>
    <div class="row g-4">
      <div class="col-sm-6 col-lg-4">
        <div class="product-card h-100">
          <div class="product-image">
            <img src="https://picsum.photos/seed/dripper/500/350" alt="Tablet">
          </div>
          <div class="product-content d-flex flex-column">
            <h5 class="product-title">
              Tablet
            </h5>
            <p class="product-price">
              $28.00
            </p>
            <button class="btn btn-primary mt-auto">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-4">
        <div class="product-card h-100">
          <div class="product-image">
            <img src="https://picsum.photos/seed/paint/500/350" alt="Painting">
          </div>
          <div class="product-content d-flex flex-column">
            <h5 class="product-title">
              Painting
            </h5>
            <p class="product-price">
              $64.00
            </p>
            <button class="btn btn-primary mt-auto">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-4">
        <div class="product-card h-100">
          <div class="product-image">
            <img src="https://picsum.photos/seed/case/500/350" alt="School Bag">
          </div>
          <div class="product-content d-flex flex-column">
            <h5 class="product-title">
              School Bag
            </h5>
            <p class="product-price">
              $49.00
            </p>
            <button class="btn btn-primary mt-auto">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="card m-5">
    <div class="card-header bg-secondary">
      <h2 class="text-white">
        Your Cart &amp; Checkout
      </h2>
    </div>
    <div class="card-body">
      <ul class="list-group mb-4">
        <li class="list-group-item d-flex justify-content-between">
          <span>Tablet</span>
          <span>$28.00</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
          <span>Clouds Painting</span>
          <span>$64.00</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
          <span>School Bag</span>
          <span>$49.00</span>
        </li>
        <li class="list-group-item d-flex justify-content-between fw-bold">
          <span>Total</span>
          <span>$141.00</span>
        </li>
      </ul>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">
            Full name
          </label>
          <input type="text" class="form-control" id="name" placeholder="Enter name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">
            Email
          </label>
          <input type="email" class="form-control" id="email" placeholder="Enter email">
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">
            Address
          </label>
          <input type="text" class="form-control" id="address" placeholder="Enter address">
        </div>
        <div class="row g-3 mb-3">
          <div class="col-7">
            <label for="city" class="form-label">
              City
            </label>
            <input type="text" class="form-control" id="city" placeholder="Enter city">
          </div>
          <div class="col-5">
            <label for="zip" class="form-label">
              Postal code
            </label>
            <input type="text" class="form-control" id="zip" placeholder="Enter postal code">
          </div>
        </div>
        <div class="mb-3">
          <label for="card" class="form-label">
            Card number
          </label>
          <input type="text" class="form-control" id="card" placeholder="1234 5678 9012 3456">
        </div>
        <div class="row g-3 mb-4">
          <div class="col-6">
            <label for="exp" class="form-label">Expiry</label>
            <input type="text" class="form-control" id="exp" placeholder="MM/YY">
          </div>
          <div class="col-6">
            <label for="cvc" class="form-label">CVC</label>
            <input type="text" class="form-control" id="cvc" placeholder="Enter CVC">
          </div>
        </div>
        <button type="submit" class="btn btn-success w-40">Place Order</button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
