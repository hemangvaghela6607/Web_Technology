<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Card with Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="h3 mb-4">Products</h1>

    <div class="row g-4">
      <!-- Product 1 -->
      <div class="col-sm-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/seed/dripper/400/300" class="card-img-top" alt="Ceramic pour-over dripper">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Ceramic Pour-Over Dripper</h5>
            <p class="fs-5 fw-bold">$28.00</p>
            <button class="btn btn-primary mt-auto" data-bs-toggle="offcanvas" data-bs-target="#checkoutPanel">
              Add to Cart
            </button>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col-sm-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/seed/kettle/400/300" class="card-img-top" alt="Gooseneck kettle">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Gooseneck Kettle</h5>
            <p class="fs-5 fw-bold">$64.00</p>
            <button class="btn btn-primary mt-auto" data-bs-toggle="offcanvas" data-bs-target="#checkoutPanel">
              Add to Cart
            </button>
          </div>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="col-sm-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/seed/grinder/400/300" class="card-img-top" alt="Hand burr grinder">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Hand Burr Grinder</h5>
            <p class="fs-5 fw-bold">$49.00</p>
            <button class="btn btn-primary mt-auto" data-bs-toggle="offcanvas" data-bs-target="#checkoutPanel">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart + Checkout panel (opens when Add to Cart is clicked) -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="checkoutPanel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Your Cart &amp; Checkout</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body">
      <ul class="list-group mb-4">
        <li class="list-group-item d-flex justify-content-between">
          <span>Ceramic Pour-Over Dripper</span><span>$28.00</span>
        </li>
        <li class="list-group-item d-flex justify-content-between fw-bold">
          <span>Total</span><span>$28.00</span>
        </li>
      </ul>

      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Full name</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input type="text" class="form-control" id="address" required>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-7">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" required>
          </div>
          <div class="col-5">
            <label for="zip" class="form-label">Postal code</label>
            <input type="text" class="form-control" id="zip" required>
          </div>
        </div>
        <div class="mb-3">
          <label for="card" class="form-label">Card number</label>
          <input type="text" class="form-control" id="card" placeholder="1234 5678 9012 3456" required>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-6">
            <label for="exp" class="form-label">Expiry</label>
            <input type="text" class="form-control" id="exp" placeholder="MM/YY" required>
          </div>
          <div class="col-6">
            <label for="cvc" class="form-label">CVC</label>
            <input type="text" class="form-control" id="cvc" required>
          </div>
        </div>
        <button type="submit" class="btn btn-success w-100">Place Order</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
