<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }
        /* Header */
        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
        }
        /* Navbar */
        .navbar {
            background: #ffffff;
            padding: 18px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }
        .navbar a {
            color: #475569;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
            transition: 0.3s;
        }
        .navbar a:hover {
            color: #6366f1;
        }
        /* Main Container */
        .container {
            width: 90%;
            margin: 30px auto;
        }
        /* Cards */
        .card {
            width: 20%;
            display: inline-block;
            background-color: white;
            margin: 10px;
            padding: 20px;
            text-align: center;
            border-radius: 2px;
            box-shadow:0px 0px 6px #aaa;
        }
        .card h2 {
            color: #4a69bd;
            margin: 5px;
        }
        .card p {
            color: #555;
            font-weight: bold;
        }
        /* Table Container */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: white;
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }
        th {
            background: #4a69bd;
            color: white;
            padding: 16px;
            font-size: 16px;
        }
        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        /* Responsive */
        @media (max-width: 900px) {
            .card {
                width: 45%;
            }
        }
        @media (max-width: 600px) {
            .card {
                width: 90%;
            }
            .navbar a {
                display: block;
                margin: 12px;
            }
            table {
                font-size: 13px;
            }
            th,
            td {
                padding: 10px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Placement Dashboard</h1>
    </div>
    <div class="navbar">
        <a href="#"> Home</a>
        <a href="#"> Students</a>
        <a href="#"> Companies</a>
        <a href="#"> Placements</a>
        <a href="#"> Logout</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>250</h2>
            <p>Students</p>
        </div>
        <div class="card">
            <h2>40</h2>
            <p>Companies</p>
        </div>
        <div class="card">
            <h2>180</h2>
            <p>Students Placed</p>
        </div>
        <div class="card">
            <h2>72%</h2>
            <p>Placement Rate</p>
        </div>
        <table>
            <tr>
                <th>Company</th>
                <th>Package</th>
                <th>Students Selected</th>
                <th>Status</th>
            </tr>
            <tr>
                <td>TCS</td>
                <td>₹4 LPA</td>
                <td>50</td>
                <td>Completed</td>
            </tr>
            <tr>
                <td>Infosys</td>
                <td>₹5 LPA</td>
                <td>35</td>
                <td>Completed</td>
            </tr>
            <tr>
                <td>Wipro</td>
                <td>₹4.5 LPA</td>
                <td>28</td>
                <td>Ongoing</td>
            </tr>
            <tr>
                <td>Microsoft</td>
                <td>₹6 LPA</td>
                <td>40</td>
                <td>Upcoming</td>
            </tr>
        </table>
    </div>
</body>
</html>
