<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 300px;
            background-color: lightgray;
        }
        
        .box {
            flex: 1;
            margin: 10px;
            padding: 30px;
            text-align: center;
            background-color: steelblue;
            color: white;
        }

        .box2 {
            flex: 2;
        }
    </style>
</head>
<body>
     <h1>Flex Container and Flex Child</h1>

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box">Box 3</div>
    </div>
</body>
</html>
