<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Loader</title>
    <style>
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .ball {
            width: 20px;
            height: 20px;
            background-color: blue;
            border-radius: 50%;
            margin: 5px;
            animation: bounce 0.6s infinite alternate;
        }

        .ball:nth-child(2) {
            animation-delay: 0.2s;
        }

        .ball:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-40px);
            }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
    </div>
</body>
</html>
