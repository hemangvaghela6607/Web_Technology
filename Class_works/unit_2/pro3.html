<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial;
            background-color: lightblue;
        }
        .loginbox{
            width: 300px;
            background-color: white;
            padding: 20px;
            margin: 100px auto;
            border-radius: 10px;
            text-align: center;

        }
        .h1{
            text-align: center;
            color: aquamarine;
        }
        input{
            margin: 10px;
            
        }
        button{
            border-radius: 10px;
            margin-top: 10px;
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <div class="loginbox">
        <h1 class="h1">LOGIN</h1>
        <input type="text" placeholder="Enter a name">
        <input type="password" placeholder="Enter a pass">
        <br>
        <button>
            login
        </button>
    </div>
</body>
</html>
