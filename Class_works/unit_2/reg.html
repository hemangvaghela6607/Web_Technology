<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <form>
        <div class="container mt-2">
        <h1>Student Registration </h1>
        <div class="container mb-5">
            <label class="control-lable">Student Name</label>
            <input type="text" placeholder="Enter Student name" class="form-control">
        </div>
        <div class="container mb-5">
            <label class="control-lable">Email</label>
            <input type="text" placeholder="Enter Email" class="form-control">
        </div>
        <div class="container mb-5">
            <label class="control-lable">Password</label>
            <input type="text" placeholder="Enter Password" class="form-control">
        </div>
        <div class="container mb-5">
            <label class="control-lable">Mobile Number</label>
            <input type="text" placeholder="Enter Mobile Number" class="form-control">
        </div>
        <div class="col-6">
           <button class="btn btn-primary">Register</button>
           <button class="btn btn-danger">Reset</button>
        </div>
        </div>
    </form>
</body>
</html>
