<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Columns</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="row text-center">

        <div class="col bg-primary text-white p-3">Column 1</div>
        <div class="col bg-secondary text-white p-3">Column 2</div>
        <div class="col bg-success text-white p-3">Column 3</div>
        <div class="col bg-danger text-white p-3">Column 4</div>
        <div class="col bg-warning text-dark p-3">Column 5</div>
        <div class="col bg-info text-dark p-3">Column 6</div>
        <div class="col bg-dark text-white p-3">Column 7</div>
        <div class="col bg-primary text-white p-3">Column 8</div>
        <div class="col bg-success text-white p-3">Column 9</div>
        <div class="col bg-danger text-white p-3">Column 10</div>
        <div class="col bg-warning text-dark p-3">Column 11</div>
        <div class="col bg-info text-dark p-3">Column 12</div>

    </div>

</body>
</html>
