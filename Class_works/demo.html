<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Hemang Gaming Overlay</title>

<style>

    


/* =========================================
   BASIC
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#05000c;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================
   MAIN HORIZONTAL CANVAS

   Your video is approximately:
   1362 x 226
========================================= */

.overlay{

    width:100vw;

    height:226px;

    min-height:180px;

    position:relative;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 20% 50%,
            #ff006a 0%,
            transparent 35%
        ),

        radial-gradient(
            circle at 70% 30%,
            #6200ff 0%,
            transparent 40%
        ),

        linear-gradient(
            100deg,
            #090018,
            #24002e,
            #050014
        );

    border-top:
        3px solid #ff174f;

    border-bottom:
        3px solid #00eaff;

}


/* =========================================
   ANIMATED BACKGROUND
========================================= */

.background{

    position:absolute;

    width:200%;
    height:100%;

    left:-50%;

    background:

        linear-gradient(
            110deg,
            transparent 40%,
            rgba(255,0,120,.18),
            transparent 60%
        );

    animation:

        backgroundMove
        5s
        linear
        infinite;
}

@keyframes backgroundMove{

    0%{

        transform:
            translateX(-30%);
    }

    100%{

        transform:
            translateX(30%);
    }

}


/* =========================================
   NEON GRID
========================================= */

.grid{

    position:absolute;

    inset:0;

    opacity:.18;

    background-image:

        linear-gradient(
            rgba(0,234,255,.5) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,0,150,.5) 1px,
            transparent 1px
        );

    background-size:
        45px 45px;

    transform:
        perspective(300px)
        rotateX(35deg)
        scale(1.4);

    animation:
        gridAnimation
        3s
        linear
        infinite;
}

@keyframes gridAnimation{

    from{

        background-position:
            0 0;
    }

    to{

        background-position:
            0 45px;
    }

}


/* =========================================
   TOP GLOW LINE
========================================= */

.neon-line{

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:4px;

    background:

        linear-gradient(
            90deg,
            #00eaff,
            #ff00a8,
            #7b00ff,
            #00eaff
        );

    background-size:
        300% 100%;

    animation:
        lineMove
        3s
        linear
        infinite;

    box-shadow:

        0 0 10px #ff0080,

        0 0 25px #00eaff;
}

@keyframes lineMove{

    0%{

        background-position:
            0%;
    }

    100%{

        background-position:
            300%;
    }

}


/* =========================================
   LEFT CHANNEL SECTION
========================================= */

.channel{

    position:absolute;

    left:35px;

    top:35px;

    width:360px;

    height:150px;

    z-index:5;
}


/* small text */

.welcome{

    color:#00eaff;

    font-size:14px;

    font-weight:bold;

    letter-spacing:4px;

    margin-bottom:5px;

    animation:
        welcomeAnimation
        1s
        ease;
}

@keyframes welcomeAnimation{

    from{

        opacity:0;

        transform:
            translateX(-50px);
    }

    to{

        opacity:1;

        transform:
            translateX(0);
    }

}


.welcome1{

    color:#00eaff;

    font-size:12px;

    font-weight:bold;

    letter-spacing:4px;

    margin-left: 120px;

    animation:
        welcomeAnimation
        1s
        ease;
}

@keyframes welcome1Animation{

    from{

        opacity:0;

        transform:
            translateX(-50px);
    }

    to{

        opacity:1;

        transform:
            translateX(0);
    }

}


/* =========================================
   MAIN CHANNEL NAME
========================================= */

.channel-name{

    font-size:42px;

    font-weight:900;

    color:white;

    letter-spacing:3px;

    text-transform:uppercase;

    position:relative;

    margin-left: 35px;

    display:inline-block;

    text-shadow:

        2px 2px 0 #ff006a,

        4px 4px 0 #6500ff,

        0 0 15px #00eaff,

        0 0 35px #ff0080;

    animation:

        titleGlow
        2s
        infinite
        alternate,

        titleEnter
        1s
        ease;
}

@keyframes titleGlow{

    0%{

        text-shadow:

            2px 2px 0 #ff006a,

            0 0 10px #ff006a,

            0 0 20px #ff006a;
    }

    100%{

        text-shadow:

            2px 2px 0 #00eaff,

            0 0 15px #00eaff,

            0 0 35px #00eaff,

            0 0 55px #6500ff;
    }

}

@keyframes titleEnter{

    from{

        opacity:0;

        transform:
            scale(.5)
            translateX(-50px);
    }

    to{

        opacity:1;

        transform:
            scale(1)
            translateX(0);
    }

}


/* =========================================
   GLITCH EFFECT
========================================= */

.channel-name::before,
.channel-name::after{

    content:
        "HEMANG GAMING";

    position:absolute;

    left:0;

    top:0;

    width:100%;

    overflow:hidden;

    opacity:.7;
}

.channel-name::before{

    color:#00ffff;

    transform:
        translate(2px,0);

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 35%,
            0 35%
        );

    animation:
        glitch1
        2s
        infinite;
}

.channel-name::after{

    color:#ff0066;

    transform:
        translate(-2px,0);

    clip-path:
        polygon(
            0 65%,
            100% 65%,
            100% 100%,
            0 100%
        );

    animation:
        glitch2
        1.5s
        infinite;
}

@keyframes glitch1{

    0%,90%,100%{

        transform:
            translate(2px,0);
    }

    92%{

        transform:
            translate(10px,-2px);
    }

    94%{

        transform:
            translate(-5px,2px);
    }

}

@keyframes glitch2{

    0%,90%,100%{

        transform:
            translate(-2px,0);
    }

    93%{

        transform:
            translate(-10px,2px);
    }

    95%{

        transform:
            translate(5px,-2px);
    }

}


/* =========================================
   SUB TITLE
========================================= */

.subtitle{

    margin-top:8px;
    margin-left: 10px;

    color:#eeeeee;

    font-size:15px;

    font-weight:bold;

    letter-spacing:2px;

}


/* =========================================
   CENTER SECTION
========================================= */

.center{

    position:absolute;

    left:50%;

    top:30px;

    transform:
        translateX(-50%);

    text-align:center;

    z-index:10;
}


/* animated icon */

.game-icon{

    font-size:30px;
     margin-top: 30px;
    animation:

        controllerFloat
        1.5s
        infinite
        alternate;
}

@keyframes controllerFloat{

    from{

        transform:
            translateY(0)
            rotate(-5deg);
    }

    to{

        transform:
            translateY(-8px)
            rotate(5deg);
    }

}


/* =========================================
   CENTER TEXT
========================================= */

.stream-text{

    font-size:25px;

    font-weight:900;

    color:white;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-top: 10px;

    text-shadow:

        0 0 10px #ff006a,

        0 0 20px #7b00ff;

    animation:
        streamPulse
        2s
        infinite
        alternate;
}

@keyframes streamPulse{

    from{

        transform:
            scale(1);
    }

    to{

        transform:
            scale(1.08);
    }

}


/* =========================================
   CENTER BADGE
========================================= */

.badge{

    display:inline-block;

    margin-top:8px;

    padding:6px 18px;

    border-radius:20px;

    background:

        linear-gradient(
            90deg,
            #ff006a,
            #7200ff
        );

    color:white;

    font-size:13px;

    font-weight:bold;

    box-shadow:

        0 0 10px #ff006a,

        0 0 25px #7200ff;

    animation:

        badgePulse
        1.5s
        infinite;
}

@keyframes badgePulse{

    0%,100%{

        box-shadow:

            0 0 8px #ff006a;
    }

    50%{

        box-shadow:

            0 0 25px #00eaff,

            0 0 40px #ff006a;
    }

}


/* =========================================
   RIGHT INFORMATION PANEL
========================================= */

.info{

    position:absolute;

    right:30px;

    top:30px;

    width:350px;

    height:160px;

    z-index:10;

    display:flex;

    flex-direction:column;

    justify-content:center;

    gap:12px;
}


/* =========================================
   INFO ROW
========================================= */

.info-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:9px 15px;

    border-left:

        3px solid #00eaff;

    background:

        rgba(
            0,
            0,
            20,
            .65
        );

    border-radius:6px;

    transform:
        translateX(50px);

    opacity:0;

    animation:
        rowEnter
        .8s
        forwards;
}

.info-row:nth-child(1){

    animation-delay:
        .5s;
}

.info-row:nth-child(2){

    animation-delay:
        .8s;
}

.info-row:nth-child(3){

    animation-delay:
        1.1s;
}

@keyframes rowEnter{

    to{

        transform:
            translateX(0);

        opacity:1;
    }

}


.label{

    color:#00eaff;

    font-size:12px;

    font-weight:bold;

    letter-spacing:1px;
}

.value{

    color:white;

    font-size:14px;

    font-weight:bold;

}


/* =========================================
   PARTICLES
========================================= */

.particle{

    position:absolute;

    width:4px;

    height:4px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:

        0 0 8px #00eaff,

        0 0 15px #00eaff;

    animation:
        particleMove
        linear
        infinite;

    z-index:3;
}

@keyframes particleMove{

    from{

        transform:
            translateY(230px);

        opacity:0;
    }

    20%{

        opacity:1;
    }

    80%{

        opacity:1;
    }

    to{

        transform:
            translateY(-20px);

        opacity:0;
    }

}


/* =========================================
   CORNER DECORATION
========================================= */

.corner{

    position:absolute;

    width:80px;

    height:80px;

    border:2px solid #00eaff;

    opacity:.6;
}

.corner-left{

    left:-40px;

    bottom:-40px;

    transform:
        rotate(45deg);
}

.corner-right{

    right:-40px;

    bottom:-40px;

    transform:
        rotate(45deg);

}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:900px){

    .channel{

        left:20px;

        width:300px;
    }

    .channel-name{

        font-size:30px;
    }

    .center{

        display:none;
    }

    .info{

        right:15px;

        width:280px;
    }

}




/* ================================== */



/* =====================================================
           BOTTOM LIVE BAR
        ===================================================== */

        .bottom-message {

            margin-right: 0%;
            position: absolute;

            right: 20px;
            bottom: 2px;

            width: 570px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;
        }


        .live {

            padding:
                5px 10px;

            color: white;

            font-size: 10px;

            font-weight: 1000;

            border-radius: 3px;

            background:

                linear-gradient(
                    90deg,
                    #ff005c,
                    #7200ff
                );

            box-shadow:

                0 0 12px
                rgba(255,0,128,.4);

            animation:

                livePulse
                1s
                infinite;
        }


        @keyframes livePulse {

            50% {

                transform:
                    scale(1.08);
            }
        }


        .message {

            width: 420px;

            height: 22px;

            overflow: hidden;

            border:
                1px solid
                rgba(0,238,255,.3);

            border-radius: 3px;

            background:
                rgba(0,0,0,.45);
        }


        .message span {

            display: block;

            padding:
                5px 8px;

            color: #dffaff;

            font-size: 8px;

            font-weight: 900;

            letter-spacing: 1px;

            white-space: nowrap;

            animation:

                marquee
                9s
                linear
                infinite;
        }


        @keyframes marquee {

            from {

                transform:
                    translateX(100%);
            }

            to {

                transform:
                    translateX(-120%);
            }
        }

</style>

</head>


<body>


<!-- =====================================
     MAIN OVERLAY
===================================== -->

<div class="overlay">


    <!-- BACKGROUND -->

    <div class="background"></div>

    <div class="grid"></div>


    <!-- NEON LINE -->

    <div class="neon-line"></div>


    <!-- =================================
         LEFT CHANNEL
    ================================== -->

    <div class="channel">

        <div class="welcome">

            🎮 WELCOME TO NEW STREAM

        </div>

        <div class="welcome1">

                                           WITH

        </div>


        <div class="channel-name">

                                            HEMANG GAMING

        </div>


        <div class="subtitle">

            BGMI • LIVE • ENTERTAINMENT

        </div>

    </div>


    <!-- =================================
         CENTER
    ================================== -->

    <div class="center">

        <div class="game-icon">

            🎮

        </div>


        <div class="stream-text">

            LET'S PLAY BGMI

        </div>



    </div>


    <!-- =================================
         RIGHT INFORMATION
    ================================== -->

    <div class="info">


        <div class="info-row">

            <span class="label">

                🎮 GAME

            </span>

            <span class="value">

                BGMI

            </span>

        </div>


        <div class="info-row">

            <span class="label">

                👑 CHANNEL

            </span>

            <span class="value">

                HEMANG GAMING

            </span>

        </div>


        <div class="info-row">

            <span class="label">

                🔥Top UPI Today

            </span>

            <span class="value">

               -

            </span>

        </div>


    </div>


    <!-- CORNERS -->

    <div class="corner corner-left"></div>

    <div class="corner corner-right"></div>
<!-- 
     /* ===============================================
                 LIVE MESSAGE
            ==================================================*/ -->

            <div class="bottom-message" >


                <div class="live">

                                       ● LIVE

                </div>


                <div class="message">


                    <span id="messageText">

                                    WELCOME TO HEMANG GAMING
                                    • LIKE • SHARE • SUBSCRIBE
                                    • LET'S PLAY BGMI!

                    </span>


                </div>

                
            </div>


        </div>


    </div>



</div>


<script>


/* =====================================
   PARTICLES
===================================== */

const overlay =
    document.querySelector(".overlay");


for(let i = 0; i < 70; i++){

    const particle =
        document.createElement("div");

    particle.className =
        "particle";


    particle.style.left =
        Math.random() * 100 + "%";


    particle.style.animationDuration =
        (2 + Math.random() * 5) + "s";


    particle.style.animationDelay =
        Math.random() * 5 + "s";


    /* Random particle size */

    const size =
        2 + Math.random() * 4;

    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";


    overlay.appendChild(
        particle
    );

}


/* =====================================
   RANDOM GLITCH
===================================== */

const title =
    document.querySelector(
        ".channel-name"
    );


setInterval(() => {

    title.style.transform =
        `translateX(
            ${(Math.random()-0.5)*5}px
        )`;


    setTimeout(() => {

        title.style.transform =
            "translateX(0)";

    },100);

},3000);


/* =====================================
   DYNAMIC "LIVE" TEXT
===================================== */

const messages = [

    "🎮 LET'S PLAY BGMI",

    "🔥 CLUTCH • RANK PUSH",

    "🎮 BGMI STREAM",

    "⚡ CLUTCH TIME",

    // "👑 HEMANG GAMING",


];


let index = 0;


const streamText =
    document.querySelector(
        ".stream-text"
    );


setInterval(() => {

    index++;

    if(index >= messages.length){

        index = 0;

    }


    streamText.style.opacity = "0";


    setTimeout(() => {

        streamText.innerText =
            messages[index];

        streamText.style.opacity =
            "1";

    },300);

},2500);

</script>

           

</body>

</html>
