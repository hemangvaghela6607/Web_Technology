<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height :300px;
            width:300px;
            border: 5px dotted black;
        }
        div.name
        {
            background-color:pink;
        }
        div.common
        {
            font-size: 60px;
            color: brown;
            
        }

        
        div.rgb
        {
            background-color:rgb(116, 114, 26);
        }
         div.hex
        {
            background-color:#c17b75;
        }
         div.hsl
        {
            background-color:hsl(0, 68%, 58%);
        }
        div.opacity
        {
            background-color: rgb(255,230,0,1);
        }



        
    </style>
</head>
<body>
    <h1>background color: name</h1>
    <div class="name common">Data</div>

    <h1>background color: RGB</h1>
    <div class="rgb"></div>

    <h1>background color: Hex Values</h1>
    <div class="hex"></div>

     <h1>background color: HSL Values</h1>
     <div class="hsl">
    
     </div>

     <h1>background color:Opacity / Transparency</h1>
     <div class="opacity"></div>
</body>
</html>
